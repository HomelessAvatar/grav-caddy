name: Build and Publish Grav Caddy Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      target_tag:
        type: string
        required: false
        default: ''
  schedule:
    # Rebuild weekly on Mondays at 03:00 UTC for latest base image & security patches
    - cron: '0 3 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_tag != '' && format('refs/tags/{0}', inputs.target_tag) || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.target_tag }},enable=${{ inputs.target_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}
            type=raw,value=php8.4
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Determine Grav version
        id: grav_version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v? ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            echo "version=${VER#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.target_tag }}" ]; then
            VER="${{ inputs.target_tag }}"
            echo "version=${VER#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=2.1.2" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GRAV_VERSION=${{ steps.grav_version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
